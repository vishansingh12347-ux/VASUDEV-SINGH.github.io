<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10233f">
  <meta name="description" content="शाला-सेतु — प्रधानाचार्य का सुरक्षित स्कूल डैशबोर्ड।">
  <title>प्रधानाचार्य डैशबोर्ड | शाला-सेतु</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body data-page="principal">
  <div id="app" class="app-root" aria-live="polite">
    <div class="boot-screen"><div class="loader"></div><p>प्रधानाचार्य डैशबोर्ड लोड हो रहा है…</p></div>
  </div>
  <script type="module" src="./src/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').then((registration) => {
        registration.update().catch(() => {});
        window.setInterval(() => registration.update().catch(() => {}), 60 * 60 * 1000);
      }).catch(() => {}));
    }
  </script>
</body>
</html>
